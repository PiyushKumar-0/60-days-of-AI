<!DOCTYPE html><html><head><meta charset="utf-8"><title>Typing Speed Studio</title>
<style>
body{margin:0;font-family:Inter,Arial;background:#0f172a;color:#e2e8f0}header{padding:18px;background:#111827;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#1e293b;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0004}button,select{background:#2563eb;color:#fff;border:none;padding:10px 14px;border-radius:10px}button:hover{opacity:.9}.text{font:20px/1.9 monospace;background:#0b1220;padding:18px;border-radius:12px;min-height:120px;white-space:pre-wrap}.correct{color:#22c55e}.wrong{color:#ef4444;background:#450a0a}.current{background:#f59e0b;color:#000}.row{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:#0b1220;padding:12px;border-radius:12px;text-align:center}textarea{width:100%;height:120px;border-radius:12px;background:#020617;color:#fff;padding:12px;font:20px monospace}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155}svg{width:100%;height:160px;background:#0b1220;border-radius:10px}
</style></head><body><header><h2>⌨️ Typing Speed Studio</h2><div id=pb></div></header><div class=wrap>
<div class=card><div class=row><select id=lang><option>JavaScript</option><option>Python</option><option>Java</option><option>C++</option><option>HTML</option><option>SQL</option></select><select id=mode><option value=30>30s</option><option value=60 selected>60s</option><option value=120>120s</option></select><button onclick=start()>Start</button><button onclick=restart()>Restart</button></div></div>
<div class=card><div id=target class=text>Press Start</div><textarea id=input placeholder="Type here..." disabled></textarea></div>
<div class=card><div class=row><div class=stat><div>WPM</div><h2 id=wpm>0</h2></div><div class=stat><div>Accuracy</div><h2 id=acc>100%</h2></div><div class=stat><div>Time</div><h2 id=time>60</h2></div><div class=stat><div>Mistakes</div><h2 id=mist>0</h2></div></div></div>
<div class=card><h3>Performance Analytics</h3><div class=row><div class=stat><div>Best WPM</div><h2 id=best>0</h2></div><div class=stat><div>Sessions</div><h2 id=sessions>0</h2></div></div><svg id=chart viewBox="0 0 300 160"></svg><table><thead><tr><th>Date</th><th>Lang</th><th>WPM</th><th>Acc</th></tr></thead><tbody id=hist></tbody></table></div></div>
<script>
const data={JavaScript:[`function sum(a,b){return a+b;}`,`const nums=[1,2,3]; nums.map(n=>n*n);`],Python:[`def factorial(n): return 1 if n<=1 else n*factorial(n-1)`,`for i in range(5): print(i)`],Java:[`public static void main(String[] args){ System.out.println("Hello"); }`,`List<String> list=new ArrayList<>();`],"C++":[`std::vector<int> v={1,2,3};`,`for(auto &x:v){ std::cout<<x; }`],HTML:[`<section><h1>Portfolio</h1><p>Welcome</p></section>`,`<button class="primary">Save</button>`],SQL:[`SELECT name FROM users WHERE score>90 ORDER BY score DESC;`,`UPDATE products SET price=price*1.1 WHERE category='Books';`]};
let target="",startTime,timer,left=60,running=false;
const t=targetEl=document.getElementById('target'),inp=document.getElementById('input');
function pick(){let a=data[lang.value];target=a[Math.floor(Math.random()*a.length)];render();}
function render(){let txt=inp.value,h="";for(let i=0;i<target.length;i++){let c=target[i],x=txt[i];if(x==null)h+=i==txt.length?`<span class=current>${c}</span>`:c;else if(x===c)h+=`<span class=correct>${c}</span>`;else h+=`<span class=wrong>${c}</span>`;}t.innerHTML=h;}
function start(){pick();inp.value="";inp.disabled=false;inp.focus();left=+mode.value;time.textContent=left;running=true;startTime=Date.now();clearInterval(timer);timer=setInterval(()=>{left--;time.textContent=left;if(left<=0)finish();},1000);}
function restart(){clearInterval(timer);running=false;inp.disabled=true;target="";t.textContent="Press Start";wpm.textContent=0;acc.textContent="100%";mist.textContent=0;time.textContent=mode.value;}
inp.oninput=()=>{if(!running)return;render();let txt=inp.value,c=0,m=0;for(let i=0;i<txt.length;i++){if(txt[i]===target[i])c++;else m++;}mist.textContent=m;let mins=(Date.now()-startTime)/60000;wpm.textContent=Math.max(0,Math.round((c/5)/Math.max(mins,.01)));acc.textContent=Math.round((c/Math.max(txt.length,1))*100)+"%";if(txt===target)finish();}
function finish(){clearInterval(timer);running=false;inp.disabled=true;let rec={d:new Date().toLocaleDateString(),l:lang.value,w:+wpm.textContent,a:acc.textContent};let h=JSON.parse(localStorage.tss||"[]");h.push(rec);localStorage.tss=JSON.stringify(h);load();}
function load(){let h=JSON.parse(localStorage.tss||"[]");sessions.textContent=h.length;let bestv=Math.max(0,...h.map(x=>x.w));best.textContent=bestv;pb.textContent="🏆 "+bestv+" WPM";hist.innerHTML=h.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.l}</td><td>${x.w}</td><td>${x.a}</td></tr>`).join("");let pts=h.slice(-10);let svg=document.getElementById("chart");svg.innerHTML='<polyline fill="none" stroke="#60a5fa" stroke-width="3" points="'+pts.map((r,i)=>`${20+i*28},${140-r.w}`).join(" ")+'"/>'+pts.map((r,i)=>`<circle cx="${20+i*28}" cy="${140-r.w}" r="3" fill="#22c55e"/>`).join("");}
load();time.textContent=mode.value;
</script></body></html>
