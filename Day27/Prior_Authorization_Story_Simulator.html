<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script><title>PA Story Simulator</title></head>
<body class="bg-slate-100">
<div class="max-w-3xl mx-auto p-4">
<h1 class="text-2xl font-bold mb-2">Prior Authorization Story Simulator</h1>
<div class="w-full bg-gray-200 rounded"><div id="bar" class="bg-blue-600 h-3 rounded" style="width:0%"></div></div>
<div id="chat" class="bg-white rounded shadow p-4 h-[60vh] overflow-y-auto mt-4 space-y-3"></div>
<div id="choices" class="mt-4 flex gap-2 flex-wrap"></div>
</div>
<script>
const scenes=[
{n:"Dr. Patel at City Medical Center diagnoses Rheumatoid Arthritis and prescribes Humira."},
{n:"Provider → PA Request → StarCare Health (illustrative example). Approved PA is saved on file."},
{n:"Priya: Prior Authorization checks medical necessity. Step therapy is not just bureaucracy—for aggressive disease, delays can affect progression. AMA 2023 PA Survey: PA causes treatment delays in the majority of cases."},
{n:"Priya: Payer checks eligibility, clinical documentation, ICD-10 match and step therapy history."},
{n:"Denied: Missing step therapy documentation. Denial is not permanent. PA denials cost physician offices 2+ staff hours to resolve."},
{n:"Appeal: collect records, Letter of Medical Necessity and file formal appeal."},
{n:"Approved! Reference number SC-PA-2026-10421. Saved on file. No repeat PA needed for Humira."},
{n:"Takeaways: Patient learns the process. Systems track denial rate, appeal rate and resolution time."}
];
let i=0;
const chat=document.getElementById('chat'),choices=document.getElementById('choices'),bar=document.getElementById('bar');
function center(t){let d=document.createElement('div');d.className="text-center italic text-gray-600";d.textContent=t;chat.appendChild(d);}
function bubble(side,name,msg){
 let w=document.createElement('div');w.className="flex "+(side=="left"?"justify-start":"justify-end");
 let b=document.createElement('div');b.className=(side=="left"?"bg-blue-100":"bg-green-100")+" rounded-xl p-3 max-w-md";
 let h=document.createElement('div');h.className="font-bold";h.textContent=name;
 let p=document.createElement('div');p.textContent=msg;
 b.appendChild(h);b.appendChild(p);w.appendChild(b);chat.appendChild(w);
}
function render(){
 choices.replaceChildren();
 bar.style.width=((i)/scenes.length*100)+"%";
 if(i>=scenes.length){bar.style.width="100%";center("Story Complete");return;}
 center("Scene "+(i+1));
 bubble("left","👦 Rahul","Can you explain what's happening?");
 bubble("right","👧 Priya",scenes[i].n);
 ["Continue","Tell me more"].forEach(lbl=>{
   let btn=document.createElement('button');
   btn.className="px-4 py-2 bg-blue-600 text-white rounded";
   btn.textContent=lbl;
   btn.onclick=()=>{i++;render();chat.scrollTop=chat.scrollHeight;};
   choices.appendChild(btn);
 });
 chat.scrollTop=chat.scrollHeight;
}
render();
</script></body></html>
